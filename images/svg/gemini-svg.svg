<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;family=Montserrat:wght@400;500&amp;display=swap');

      .bg {
        fill: #121212;
      }
      .circle-emblem {
        fill: none;
        stroke: #c5a059;
        stroke-width: 1.5;
      }
      .letter-a {
        font-family: 'Cinzel', 'Playfair Display', Georgia, serif;
        font-size: 46px;
        font-weight: 600;
        fill: #c5a059;
        text-anchor: middle;
        dominant-baseline: central;
      }
      .title-restaurant {
        font-family: 'Cinzel', 'Playfair Display', Georgia, serif;
        font-size: 42px;
        font-weight: 700;
        fill: #ffffff;
        letter-spacing: 3.5px;
      }
      .title-akem {
        font-family: 'Cinzel', 'Playfair Display', Georgia, serif;
        font-size: 42px;
        font-weight: 700;
        fill: #c5a059;
        letter-spacing: 3.5px;
      }
      .subtitle {
        font-family: 'Montserrat', sans-serif;
        font-size: 19px;
        font-weight: 400;
        fill: #c5a059;
        letter-spacing: 8.5px;
      }
    </style>
  </defs>

  <!-- Arrière-plan (optionnel si votre fond de site est déjà sombre) -->
  <rect class="bg" width="100%" height="100%" rx="8"/>

  <!-- Emblème Cercle + Lettre A -->
  <g transform="translate(120, 120)">
    <circle class="circle-emblem" r="54" />
    <text class="letter-a" y="-2">A</text>
  </g>

  <!-- Texte RESTAURANT AKEM -->
  <text x="210" y="115">
    <tspan class="title-restaurant">RESTAURANT </tspan>
    <tspan class="title-akem">AKEM</tspan>
  </text>

  <!-- Sous-titre HAUTE GASTRONOMIE -->
  <text x="212" y="158" class="subtitle">HAUTE GASTRONOMIE</text>
</svg>
